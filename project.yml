name: kTorrent
options:
  bundleIdPrefix: me.kylebolton
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
    # Ad-hoc signing by default so the project builds on any Mac.
    # scripts/release.sh re-signs with a Developer ID identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

targets:
  kTorrent:
    type: application
    platform: macOS
    sources:
      - path: Sources/KTorrent
      - path: Sources/TorrentBridge
    dependencies:
      - package: SwiftSoup
      - package: Sparkle
      - sdk: libc++.tbd
      - sdk: CoreFoundation.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_NAME: kTorrent
        PRODUCT_MODULE_NAME: KTorrent
        PRODUCT_BUNDLE_IDENTIFIER: me.kylebolton.kTorrent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TorrentBridge/kTorrent-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Sources/KTorrent/Resources/kTorrent.entitlements
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/libtorrent/include
          - $(SRCROOT)/Vendor/boost/include
          - $(SRCROOT)/Vendor/openssl/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/libtorrent/lib
          - $(SRCROOT)/Vendor/openssl/lib
        OTHER_LDFLAGS:
          - -ltorrent-rasterbar
          - -lssl
          - -lcrypto
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - BOOST_ASIO_ENABLE_CANCELIO
          - BOOST_ASIO_NO_DEPRECATED
          - TORRENT_NO_DEPRECATE
          - TORRENT_USE_OPENSSL
          - TORRENT_USE_LIBCRYPTO
          - TORRENT_SSL_PEERS
          - OPENSSL_NO_SSL2
        WARNING_CFLAGS:
          - -Wno-shorten-64-to-32
          - -Wno-deprecated-declarations
          - -Wno-documentation
          - -Wno-comma
    info:
      path: Sources/KTorrent/Resources/Info.plist
      properties:
        CFBundleDisplayName: kTorrent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Kyle Bolton"
        NSLocalNetworkUsageDescription: kTorrent streams video to AirPlay devices and finds peers on your local network.
        # Sparkle: the feed lives in this repo; updates are verified against the EdDSA public key.
        SUFeedURL: https://raw.githubusercontent.com/kylebolton/kTorrent/main/appcast.xml
        SUPublicEDKey: jnuAe9Wb/I8fgl48M6n9iQxspo/o+Hv/8axT5hKbpLo=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: BitTorrent Magnet Link
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [magnet]
          - CFBundleURLName: kTorrent Link
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [ktorrent]
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [org.bittorrent.torrent]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent File
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [torrent]
              public.mime-type: [application/x-bittorrent]
    postBuildScripts:
      - name: Embed ffmpeg helpers
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$SRCROOT/Vendor/ffmpeg/bin"
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          if [ ! -x "$SRC/ffmpeg" ]; then
            echo "warning: Vendor/ffmpeg missing — run scripts/build-ffmpeg.sh (falling back to a system ffmpeg at runtime)"
            exit 0
          fi
          mkdir -p "$DEST"
          for bin in ffmpeg ffprobe; do
            if [ ! -f "$DEST/$bin" ] || [ "$SRC/$bin" -nt "$DEST/$bin" ]; then
              cp -f "$SRC/$bin" "$DEST/$bin"
              codesign --force --options runtime --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/$bin"
            fi
          done
      - name: Embed Jackett
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Jackett"
          rm -rf "$DEST"
          if ls "$SRCROOT"/Vendor/jackett/Jackett-*.tar.gz >/dev/null 2>&1; then
            mkdir -p "$DEST"
            cp -f "$SRCROOT"/Vendor/jackett/Jackett-*.tar.gz "$DEST/"
          else
            echo "warning: Vendor/jackett missing — run scripts/fetch-jackett.sh (the app will download Jackett on first launch instead)"
          fi

  kTorrentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/KTorrentTests
    dependencies:
      - target: kTorrent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.kylebolton.kTorrentTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/kTorrent.app/Contents/MacOS/kTorrent

schemes:
  kTorrent:
    build:
      targets:
        kTorrent: all
        kTorrentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [kTorrentTests]
    archive:
      config: Release
